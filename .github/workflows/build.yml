name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ══════════════════════════════════════════════
  # macOS ビルド & リリース
  # ══════════════════════════════════════════════
  build-mac:
    name: Build macOS
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # タグから version を package.json に反映
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
            pkg.version = '$TAG';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "Version set to $TAG"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install setuptools
        run: pip install setuptools

      - name: Install dependencies (skip native compile)
        run: npm ci --ignore-scripts

      # macOS: libndi.dylib は grandiose パッケージに同梱済み → NDI SDK 不要
      - name: Rebuild grandiose for Electron (macOS)
        run: npx electron-rebuild -f -w @stagetimerio/grandiose
        continue-on-error: true

      - name: Rebuild keytar for Electron
        run: npx electron-rebuild -f -w keytar
        continue-on-error: true

      # タグ push 時は GitHub Release に直接 publish
      - name: Build & Publish (macOS) - tag push
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run dist:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # workflow_dispatch 時はローカル出力のみ
      - name: Build only (macOS) - manual trigger
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run dist:mac -- --publish never

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-release
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml
          retention-days: 7
          if-no-files-found: warn

  # ══════════════════════════════════════════════
  # Windows ビルド & リリース
  # ══════════════════════════════════════════════
  build-win:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # タグから version を package.json に反映
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
            pkg.version = '$TAG';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "Version set to $TAG"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install setuptools
        run: pip install setuptools

      - name: Install Visual Studio Build Tools
        uses: microsoft/setup-msbuild@v2

      - name: Install dependencies (skip native compile)
        run: npm ci --ignore-scripts
        env:
          npm_config_msvs_version: "2022"

      # NDI SDK for Windows をインストール（DLL を grandiose に配置）
      - name: Install NDI SDK (Windows) and copy libs to grandiose
        shell: powershell
        timeout-minutes: 8
        run: |
          $ndiInstaller = "$env:TEMP\NDI_SDK.exe"
          $grandioseLib = "node_modules\@stagetimerio\grandiose\ndi\lib\win-x64"
          $urls = @(
            "https://downloads.ndi.tv/SDK/NDI_SDK/NDISDKforWindows.exe",
            "https://downloads.ndi.tv/SDK/NDI_SDK/NDI%205%20SDK.exe"
          )

          $downloaded = $false
          foreach ($url in $urls) {
            Write-Host "Downloading: $url"
            & curl.exe -L --max-time 90 --retry 2 -o $ndiInstaller $url
            if ($LASTEXITCODE -eq 0 -and (Test-Path $ndiInstaller)) {
              $downloaded = $true; break
            }
          }

          if (-not $downloaded) { Write-Host "NDI SDK download failed, skipping"; exit 0 }

          Write-Host "Installing NDI SDK silently..."
          $proc = Start-Process $ndiInstaller -ArgumentList "/S /NORESTART" -PassThru -ErrorAction SilentlyContinue
          if ($proc -and -not $proc.WaitForExit(180000)) {
            Write-Host "Installer timed out, killing"; $proc.Kill()
          }

          $ndkPaths = @(
            "C:\Program Files\NDI\NDI 6 SDK",
            "C:\Program Files\NDI\NDI 5 SDK",
            "C:\Program Files\NewTek\NDI SDK"
          )
          $ndkRoot = $null
          foreach ($p in $ndkPaths) { if (Test-Path $p) { $ndkRoot = $p; break } }
          if ($null -eq $ndkRoot) {
            $found = Get-ChildItem "C:\Program Files" -Directory -ErrorAction SilentlyContinue |
                     Where-Object { $_.Name -like "*NDI*" } | Select-Object -First 1
            if ($found) { $ndkRoot = $found.FullName }
          }
          if ($null -eq $ndkRoot) { Write-Host "NDI SDK not found, skipping DLL copy"; exit 0 }

          Write-Host "NDI SDK found at: $ndkRoot"
          New-Item -ItemType Directory -Force -Path $grandioseLib | Out-Null
          $srcBin = Join-Path $ndkRoot "Bin\x64"
          $srcLib = Join-Path $ndkRoot "Lib\x64"
          if (Test-Path "$srcBin\Processing.NDI.Lib.x64.dll") {
            Copy-Item "$srcBin\Processing.NDI.Lib.x64.dll" -Destination $grandioseLib
            Write-Host "Copied DLL"
          }
          if (Test-Path "$srcLib\Processing.NDI.Lib.x64.lib") {
            Copy-Item "$srcLib\Processing.NDI.Lib.x64.lib" -Destination $grandioseLib
            Write-Host "Copied LIB"
          }
          Get-ChildItem $grandioseLib -ErrorAction SilentlyContinue
        continue-on-error: true

      - name: Rebuild grandiose for Electron (Windows)
        run: npx electron-rebuild -f -w @stagetimerio/grandiose
        continue-on-error: true
        env:
          npm_config_msvs_version: "2022"
          GYP_MSVS_VERSION: "2022"

      - name: Rebuild keytar for Electron
        run: npx electron-rebuild -f -w keytar
        continue-on-error: true
        env:
          npm_config_msvs_version: "2022"
          GYP_MSVS_VERSION: "2022"

      # タグ push 時は GitHub Release に直接 publish
      - name: Build & Publish (Windows) - tag push
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # workflow_dispatch 時はローカル出力のみ
      - name: Build only (Windows) - manual trigger
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run dist:win -- --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-release
          path: |
            release/*.exe
            release/*.yml
          retention-days: 7
          if-no-files-found: warn
