name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ══════════════════════════════════════════════
  # macOS ビルド
  # ══════════════════════════════════════════════
  build-mac:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install setuptools
        run: pip install setuptools

      # postinstall (electron-builder install-app-deps) をスキップして
      # grandiose の NDI SDK 依存コンパイルエラーを回避
      - name: Install dependencies (skip native compile)
        run: npm ci --ignore-scripts

      # keytar は認証に必要 → Electron 向けに再ビルド（prebuilt あり）
      - name: Rebuild keytar for Electron
        run: npx electron-rebuild -f -w keytar
        continue-on-error: true

      # GH_TOKEN を渡さない → electron-builder はビルドのみ・publishしない
      - name: Build & Package (macOS)
        run: npm run dist:mac -- --publish never

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-release
          path: |
            release/*.dmg
            release/*.zip
          retention-days: 30

  # ══════════════════════════════════════════════
  # Windows ビルド
  # ══════════════════════════════════════════════
  build-win:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install setuptools
        run: pip install setuptools

      - name: Install Visual Studio Build Tools
        uses: microsoft/setup-msbuild@v2

      # postinstall をスキップして grandiose のコンパイルエラーを回避
      - name: Install dependencies (skip native compile)
        run: npm ci --ignore-scripts
        env:
          npm_config_msvs_version: "2022"

      # keytar を Electron 向けに再ビルド
      - name: Rebuild keytar for Electron
        run: npx electron-rebuild -f -w keytar
        continue-on-error: true
        env:
          npm_config_msvs_version: "2022"
          GYP_MSVS_VERSION: "2022"

      # GH_TOKEN を渡さない → electron-builder はビルドのみ・publishしない
      - name: Build & Package (Windows)
        run: npm run dist:win -- --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-release
          path: |
            release/*.exe
          retention-days: 30

  # ══════════════════════════════════════════════
  # GitHub Release 作成
  # ══════════════════════════════════════════════
  release:
    name: Create GitHub Release
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac-release
          path: release/mac

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: win-release
          path: release/win

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/mac/*.dmg
            release/mac/*.zip
            release/win/*.exe
          generate_release_notes: true
          draft: false
